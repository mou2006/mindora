<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | MindSentinel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            🧠 Mind<span>Sentinel</span>
        </div>

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Login to access your mental wellbeing dashboard.
        </p>


        <form method="POST"
              action="/login">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <div class="remember-row">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-submit">

                Login

            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/register">
                Sign Up
            </a>

        </p>


        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
